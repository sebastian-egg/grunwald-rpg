const key='grunwald-v04';const base={x:0,y:0,hp:512,maxHp:512,xp:45,level:3,gold:0,kills:0,atk:58,inv:[{id:crypto.randomUUID(),name:'Stahlklinge',rarity:'common',atk:7,armor:0,equipped:true}]};let S;
try{S={...base,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{S=structuredClone(base)}
let joy={x:0,y:0},wolves=[],fx=[],last=0,atkcd=0,wcd=0,ccd=0,logs=['Ihr habt Grünwald betreten.'];
function save(){localStorage.setItem(key,JSON.stringify(S))}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function atk(){return S.atk+S.inv.filter(i=>i.equipped).reduce((n,i)=>n+i.atk,0)}
function msg(t,c=''){logs.unshift((c?`<span style="color:${c}">`:'')+t+(c?'</span>':''));logs=logs.slice(0,4);document.getElementById('combatlog').innerHTML=logs.join('<br>')}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1300)}
function spawn(){let a=Math.random()*6.28,r=280+Math.random()*350;wolves.push({x:S.x+Math.cos(a)*r,y:S.y+Math.sin(a)*r,hp:180,maxHp:180,cd:0,flip:Math.random()<.5})} for(let i=0;i<6;i++)spawn();
function hit(w,n){w.hp-=n;fx.push({x:w.x,y:w.y,t:.5,n});if(w.hp<=0){wolves=wolves.filter(v=>v!==w);S.kills++;S.gold+=12;S.xp+=18;msg('Ihr habt 18 Erfahrung erhalten.','#4fb5ff');msg('Ihr habt 12 Gold erhalten.','#ffd44d');if(Math.random()<.55){let item={id:crypto.randomUUID(),name:'Wolfszahn-Schwert',rarity:Math.random()<.2?'rare':'uncommon',atk:5+Math.floor(Math.random()*12),armor:0,equipped:false};S.inv.push(item);msg(`Ihr habt [${item.name}] erhalten!`,item.rarity==='rare'?'#438aff':'#41d35a')}if(S.kills===5)toast('Quest abgeschlossen!');save();setTimeout(spawn,900)}}
function update(dt){S.x+=joy.x*165*dt;S.y+=joy.y*165*dt;atkcd-=dt;wcd=Math.max(0,wcd-dt);ccd=Math.max(0,ccd-dt);for(const w of wolves){let dx=S.x-w.x,dy=S.y-w.y,dd=Math.hypot(dx,dy);w.flip=dx<0;if(dd<260&&dd>58){w.x+=dx/dd*48*dt;w.y+=dy/dd*48*dt}w.cd-=dt;if(dd<65&&w.cd<=0){w.cd=1.1;S.hp=Math.max(1,S.hp-8)}}if(atkcd<=0){let w=wolves.map(x=>[x,d(S,x)]).filter(x=>x[1]<80).sort((a,b)=>a[1]-b[1])[0]?.[0];if(w){atkcd=.7;hit(w,86)}}for(const f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0)}
function draw(){let W=innerWidth,H=innerHeight,cx=W/2,cy=H/2;let gp=ctx.createPattern(I.grass,'repeat');if(gp){ctx.fillStyle=gp;ctx.fillRect(0,0,W,H)}else{ctx.fillStyle='#263d1c';ctx.fillRect(0,0,W,H)}let pp=ctx.createPattern(I.path,'repeat-y');if(pp){ctx.save();ctx.translate(cx-72-(S.x%80)*.05,-(S.y%512));ctx.fillStyle=pp;ctx.fillRect(0,-512,144,H+1024);ctx.restore()}ctx.fillStyle='rgba(0,0,0,.12)';for(let i=0;i<28;i++){let x=(i*151-S.x*.25)%W,y=(i*277-S.y*.25)%H;ctx.beginPath();ctx.arc(x<0?x+W:x,y<0?y+H:y,15+(i%4)*6,0,6.28);ctx.fill()}
for(const w of wolves){let x=cx+w.x-S.x,y=cy+w.y-S.y;if(x<-90||x>W+90||y<-80||y>H+100)continue;ctx.save();ctx.translate(x,y);if(w.flip)ctx.scale(-1,1);ctx.shadowColor='#000';ctx.shadowBlur=12;ctx.shadowOffsetY=8;ctx.drawImage(I.wolf,-62,-42,124,86);ctx.restore();ctx.fillStyle='#111d';ctx.fillRect(x-42,y-55,84,9);ctx.fillStyle='#b6201d';ctx.fillRect(x-42,y-55,84*(w.hp/w.maxHp),9);ctx.fillStyle='#fff';ctx.font='12px -apple-system';ctx.textAlign='center';ctx.fillText('Schattenwolf',x,y-62)}
ctx.save();ctx.shadowColor='#000';ctx.shadowBlur=15;ctx.shadowOffsetY=10;ctx.drawImage(I.hero,cx-66,cy-86,132,165);ctx.restore();ctx.strokeStyle='#32d441aa';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(cx,cy+55,44,15,0,0,6.28);ctx.stroke();
for(const f of fx){let x=cx+f.x-S.x,y=cy+f.y-S.y;ctx.globalAlpha=f.t/.5;ctx.fillStyle='#ffcf45';ctx.font='bold 27px -apple-system';ctx.fillText(f.n,x,y-50-(.5-f.t)*35);ctx.globalAlpha=1;ctx.strokeStyle='#ff6a1a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-25,y+5);ctx.lineTo(x+28,y-20);ctx.stroke()}
document.getElementById('hp').style.width=(S.hp/S.maxHp*100)+'%';document.getElementById('xp').style.width=(S.xp/900*100)+'%';document.getElementById('stats').textContent=`${S.hp} / ${S.maxHp}   ·   ${S.gold} Gold`;document.getElementById('level').textContent=S.level;document.getElementById('q').textContent=S.kills>=5?'Quest abgeschlossen ✓':`Tötet 5 Schattenwölfe (${Math.min(S.kills,5)}/5)`;document.getElementById('whirl').textContent=wcd>0?wcd.toFixed(1)+' s':'WIRBELWIND';document.getElementById('charge').textContent=ccd>0?ccd.toFixed(1)+' s':'ANSTURM'}
function loop(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('whirl').onclick=()=>{if(wcd)return;wcd=5;let n=0;for(const w of [...wolves])if(d(S,w)<115){hit(w,105);n++}toast(n?`Wirbelwind: ${n} Treffer`:'Kein Gegner in Reichweite')};
document.getElementById('charge').onclick=()=>{if(ccd)return;let w=wolves.map(x=>[x,d(S,x)]).filter(x=>x[1]<270).sort((a,b)=>a[1]-b[1])[0]?.[0];if(!w)return toast('Kein Ziel');ccd=6;let dx=w.x-S.x,dy=w.y-S.y,l=Math.hypot(dx,dy);S.x=w.x-dx/l*55;S.y=w.y-dy/l*55;hit(w,120)};
const je=document.getElementById('joy'),kn=document.getElementById('knob');function sj(x,y){let r=je.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),m=39,l=Math.hypot(dx,dy);if(l>m){dx=dx/l*m;dy=dy/l*m}joy={x:dx/m,y:dy/m};kn.style.transform=`translate(${dx}px,${dy}px)`}je.addEventListener('pointerdown',e=>{je.setPointerCapture(e.pointerId);sj(e.clientX,e.clientY)});je.addEventListener('pointermove',e=>{if(e.buttons)sj(e.clientX,e.clientY)});je.addEventListener('pointerup',()=>{joy={x:0,y:0};kn.style.transform='translate(0,0)'});
const panel=document.getElementById('panel'),pc=document.getElementById('pc');document.getElementById('close').onclick=()=>panel.style.display='none';document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{if(b.dataset.p==='inv'){pc.innerHTML='<h2>Inventar</h2>'+S.inv.map(i=>`<div class="item ${i.rarity}"><button onclick="eq('${i.id}')">${i.equipped?'Ablegen':'Anlegen'}</button><b>${i.name}</b><br><small>Angriff +${i.atk}</small></div>`).join('')}else if(b.dataset.p==='char'){pc.innerHTML=`<h2>Arthas · Krieger</h2><div class="item">Level ${S.level}<br>Leben ${S.hp}/${S.maxHp}<br>Angriff ${atk()}<br>Gold ${S.gold}</div>`}else{pc.innerHTML=`<h2>Wölfe im Wald</h2><div class="item">Tötet 5 Schattenwölfe.<br>Fortschritt ${Math.min(S.kills,5)}/5</div>`}panel.style.display='block'});window.eq=id=>{let i=S.inv.find(x=>x.id===id);if(i){i.equipped=!i.equipped;save();document.querySelector('[data-p="inv"]').click()}};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>
</body></html>
